
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFR3ON | إعدادات المظهر</title>

<style>
:root {
  --main: #bfc3c9;
  --accent: #b90020;
  --bg: #08090d;
  --panel: rgba(15,17,23,.88);
  --text: #f4f4f4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  color: var(--text);
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,.83),rgba(0,0,0,.9)),
    url("wolf-bg.jpg") center/cover fixed,
    #08090d;
}

header {
  padding: 22px;
  background: rgba(0,0,0,.75);
  border-bottom: 1px solid #444;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--main);
}

header a {
  color: white;
  text-decoration: none;
  padding: 10px 16px;
  border: 1px solid #777;
  border-radius: 9px;
}

.container {
  width: min(950px, 92%);
  margin: 35px auto;
}

h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
  line-height: 1.8;
}

.panel {
  background: var(--panel);
  border: 1px solid #454545;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
}

.panel h2 {
  font-size: 19px;
  margin-bottom: 18px;
  color: var(--main);
}

.setting {
  margin-bottom: 20px;
}

.setting label {
  display: block;
  margin-bottom: 10px;
  color: #ddd;
}

input[type="color"] {
  width: 65px;
  height: 42px;
  border: none;
  background: transparent;
  cursor: pointer;
}

select {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  background: #17191f;
  color: white;
  border: 1px solid #555;
}

.preview {
  padding: 25px;
  border: 1px solid var(--main);
  border-radius: 13px;
  text-align: center;
}

.preview h3 {
  color: var(--main);
  margin-bottom: 12px;
}

.preview button {
  background: var(--main);
  color: #111;
  border: none;
  padding: 12px 24px;
  border-radius: 9px;
  margin-top: 18px;
  font-weight: bold;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
  min-width: 130px;
  padding: 14px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: var(--main);
  color: #111;
}

.reset {
  background: #333;
  color: white;
  border: 1px solid #666 !important;
}

.message {
  color: #70db91;
  margin-top: 15px;
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>

<body>

<header>
  <div class="logo">ALFR3ON WEB BUILDER</div>
  <a href="index.html">العودة للرئيسية</a>
</header>

<main class="container">

  <h1>إعدادات المظهر</h1>
  <p class="subtitle">
    تحكم في ألوان واجهة المنصة وشاهد التغييرات قبل حفظها.
  </p>

  <section class="panel">
    <h2>الألوان</h2>

    <div class="setting">
      <label for="mainColor">اللون الأساسي</label>
      <input type="color" id="mainColor" value="#bfc3c9">
    </div>

    <div class="setting">
      <label for="accentColor">اللون الإضافي</label>
      <input type="color" id="accentColor" value="#b90020">
    </div>

    <div class="setting">
      <label for="backgroundColor">لون الخلفية</label>
      <input type="color" id="backgroundColor" value="#08090d">
    </div>
  </section>

  <section class="panel">
    <h2>معاينة المظهر</h2>

    <div class="preview">
      <h3>ALFR3ON DEZAINER</h3>
      <p>اصنع موقعك الخاص بأسلوبك.</p>
      <button type="button">ابدأ الآن</button>
    </div>
  </section>

  <section class="panel">
    <h2>حفظ الإعدادات</h2>

    <div class="actions">
      <button class="save" onclick="saveTheme()">حفظ المظهر</button>
      <button class="reset" onclick="resetTheme()">استعادة الافتراضي</button>
    </div>

    <p class="message" id="message">تم حفظ الإعدادات على هذا الجهاز.</p>
  </section>

</main>

<footer>
  ALFR3ON DEZAINER © 2026
</footer>

<script>
const defaults = {
  main: "#bfc3c9",
  accent: "#b90020",
  bg: "#08090d"
};

const mainInput = document.getElementById("mainColor");
const accentInput = document.getElementById("accentColor");
const bgInput = document.getElementById("backgroundColor");

function applyTheme(theme) {
  document.documentElement.style.setProperty("--main", theme.main);
  document.documentElement.style.setProperty("--accent", theme.accent);
  document.documentElement.style.setProperty("--bg", theme.bg);

  document.body.style.backgroundColor = theme.bg;

  mainInput.value = theme.main;
  accentInput.value = theme.accent;
  bgInput.value = theme.bg;
}

function getTheme() {
  return {
    main: mainInput.value,
    accent: accentInput.value,
    bg: bgInput.value
  };
}

[mainInput, accentInput, bgInput].forEach(input => {
  input.addEventListener("input", () => {
    applyTheme(getTheme());
  });
});

function saveTheme() {
  const theme = getTheme();

  localStorage.setItem(
    "alfr3on_theme",
    JSON.stringify(theme)
  );

  const message = document.getElementById("message");
  message.style.display = "block";
}

function resetTheme() {
  applyTheme(defaults);
  localStorage.removeItem("alfr3on_theme");
  document.getElementById("message").style.display = "none";
}

try {
  const saved = JSON.parse(
    localStorage.getItem("alfr3on_theme")
  );

  applyTheme(saved || defaults);
} catch {
  applyTheme(defaults);
}
</script>

</body>
</html>
