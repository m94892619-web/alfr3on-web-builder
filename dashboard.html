
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاريعي | ALFR3ON WEB BUILDER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08080a;color:#eee;
 font-family:Arial,sans-serif;padding:18px
}
header{
 text-align:center;padding:25px 10px;
 border-bottom:1px solid #333;margin-bottom:22px
}
header h1{color:#c7c7ce}
header p{color:#aaa}
.container{max-width:950px;margin:auto}
.panel{
 background:#131317;border:1px solid #333;
 border-radius:14px;padding:18px;margin-bottom:18px
}
input{
 width:100%;padding:14px;border-radius:9px;
 border:1px solid #555;background:#09090c;
 color:white;font-size:16px
}
button{
 border:1px solid #aaa;border-radius:8px;
 padding:11px 16px;margin:5px;
 cursor:pointer;font-weight:bold;
 background:linear-gradient(#eee,#999);color:#111
}
.dark{background:#292930;color:white;border-color:#555}
.red{background:#8e1421;color:white;border-color:#c33}
.project{
 background:#09090c;border:1px solid #444;
 border-radius:12px;padding:15px;margin:12px 0
}
.project h3{margin-top:0;color:#ddd}
.details{color:#aaa;font-size:13px;line-height:1.8}
.actions{margin-top:10px}
.empty{text-align:center;color:#aaa;padding:30px}
.stats{color:#ccc;margin:10px 0}
a{color:#ddd}
</style>
</head>

<body>

<header>
<h1>ALFR3ON WEB BUILDER</h1>
<p>لوحة إدارة مشاريعك</p>
</header>

<div class="container">

<section class="panel">
<h2>مشاريعي</h2>
<p class="details">إدارة المواقع التي أنشأتها وحفظتها على هذا الجهاز.</p>

<input id="search" placeholder="ابحث عن مشروع..." oninput="renderProjects()">

<div class="stats" id="stats">عدد المشاريع: 0</div>

<button onclick="location.href='builder.html'">+ إنشاء مشروع جديد</button>
<button class="dark" onclick="exportProjects()">تصدير نسخة احتياطية</button>
<button class="dark" onclick="document.getElementById('importFile').click()">استيراد نسخة</button>
<input type="file" id="importFile" accept=".json,application/json" hidden onchange="importProjects(event)">
</section>

<section class="panel">
<h2>قائمة المشاريع</h2>
<div id="projectsList"></div>
</section>

</div>

<script>
const STORAGE_KEY="alfr3on_projects";

function getProjects(){
 try{
  return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
 }catch(e){
  return [];
 }
}

function saveProjects(projects){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
}

function renderProjects(){
 const list=document.getElementById("projectsList");
 const search=document.getElementById("search").value.trim().toLowerCase();
 const projects=getProjects();

 document.getElementById("stats").textContent=
 "عدد المشاريع: "+projects.length;

 const filtered=projects.filter(p=>
  (p.name||"").toLowerCase().includes(search) ||
  (p.prompt||"").toLowerCase().includes(search)
 );

 list.innerHTML="";

 if(!filtered.length){
  list.innerHTML='<div class="empty">لا توجد مشاريع مطابقة للبحث.</div>';
  return;
 }

 filtered.forEach(p=>{
  const card=document.createElement("div");
  card.className="project";

  const title=document.createElement("h3");
  title.textContent=p.name||"مشروع بدون اسم";

  const description=document.createElement("div");
  description.className="details";
  description.textContent=p.prompt||"لا يوجد وصف";

  const date=document.createElement("div");
  date.className="details";
  date.textContent=p.timestamp?
   "آخر حفظ: "+new Date(p.timestamp).toLocaleString("ar-EG"):
   "";

  const actions=document.createElement("div");
  actions.className="actions";

  const open=document.createElement("button");
  open.textContent="فتح وتعديل";
  open.onclick=()=>location.href="builder.html?project="+encodeURIComponent(p.id);

  const preview=document.createElement("button");
  preview.className="dark";
  preview.textContent="معاينة";
  preview.onclick=()=>{
   const w=window.open("about:blank","_blank");
   if(w){
    w.document.open();
    w.document.write(p.html||"<h2>لا توجد معاينة</h2>");
    w.document.close();
   }
  };

  const download=document.createElement("button");
  download.className="dark";
  download.textContent="تنزيل";
  download.onclick=()=>downloadProject(p);

  const del=document.createElement("button");
  del.className="red";
  del.textContent="حذف";
  del.onclick=()=>deleteProject(p.id);

  actions.append(open,preview,download,del);
  card.append(title,description,date,actions);
  list.append(card);
 });
}

function deleteProject(id){
 if(!confirm("هل أنت متأكد من حذف هذا المشروع؟"))return;

 saveProjects(getProjects().filter(p=>p.id!==id));
 renderProjects();
}

function downloadProject(project){
 if(!project.html){
  alert("لا يوجد ملف HTML لهذا المشروع");
  return;
 }

 const blob=new Blob([project.html],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=(project.name||"website")+".html";
 a.click();
 URL.revokeObjectURL(url);
}

function exportProjects(){
 const projects=getProjects();
 const blob=new Blob(
  [JSON.stringify(projects,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="ALFR3ON-backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

function importProjects(event){
 const file=event.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const imported=JSON.parse(reader.result);
   if(!Array.isArray(imported))throw new Error();

   const existing=getProjects();
   const ids=new Set(existing.map(p=>p.id));

   imported.forEach(p=>{
    if(p && p.id && p.name && p.html && !ids.has(p.id)){
     existing.push(p);
     ids.add(p.id);
    }
   });

   saveProjects(existing);
   renderProjects();
   alert("تم استيراد المشاريع");
  }catch(e){
   alert("ملف النسخة الاحتياطية غير صالح");
  }
 };

 reader.readAsText(file);
 event.target.value="";
}

renderProjects();
</script>

</body>
</html>
