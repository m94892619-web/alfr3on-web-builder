
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFR3ON - Preview</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 20px;
}

header h1 {
  color: silver;
}

.toolbar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

button {
  background: linear-gradient(135deg,#fff,#aaa,#777);
  color: #080808;
  border: 1px solid #eee;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: translateY(-2px);
}

.preview-box {
  width: 100%;
  max-width: 1100px;
  height: 65vh;
  min-height: 400px;
  margin: auto;
  background: white;
  border: 3px solid silver;
  border-radius: 12px;
  overflow: hidden;
  transition: width .3s;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

.preview-box.mobile {
  width: 375px;
  max-width: 100%;
}

.note {
  text-align: center;
  color: #999;
  margin-top: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>ALFR3ON WEB BUILDER</h1>
  <p>معاينة مشروعك قبل النشر</p>
</header>

<div class="toolbar">
  <button onclick="setMode('desktop')">عرض الكمبيوتر</button>
  <button onclick="setMode('mobile')">عرض الموبايل</button>
  <button onclick="refreshPreview()">تحديث</button>
</div>

<div class="preview-box" id="previewBox">
  <iframe id="previewFrame"
  title="معاينة الموقع"
  srcdoc="<h2 style='text-align:center;font-family:Arial;margin-top:100px'>ALFR3ON PREVIEW</h2><p style='text-align:center'>ضع رابط أو كود موقعك للمعاينة</p>">
  </iframe>
</div>

<p class="note">
  هذه معاينة تجريبية، وليست نشرًا فعليًا للموقع.
</p>

<script>
function setMode(mode) {
  const box = document.getElementById("previewBox");
  box.classList.toggle("mobile", mode === "mobile");
}

function refreshPreview() {
  const frame = document.getElementById("previewFrame");
  frame.srcdoc = frame.srcdoc;
}
</script>

</body>
</html>
