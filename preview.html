
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الموقع | ALFR3ON WEB BUILDER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #08090d;
  color: white;
  min-height: 100vh;
}

header {
  padding: 17px 5%;
  background: #111218;
  border-bottom: 1px solid #393b42;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  color: #c4c7cc;
  font-weight: 900;
  font-size: 20px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button, .btn {
  border: 1px solid #aaa;
  background: #c4c7cc;
  color: #111;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
}

button:hover, .btn:hover {
  filter: brightness(1.15);
}

.secondary {
  background: #24262d;
  color: white;
  border-color: #555;
}

main {
  width: 95%;
  max-width: 1250px;
  margin: 25px auto;
}

.info {
  margin-bottom: 18px;
}

.info p {
  color: #aaa;
  margin-top: 7px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.screen {
  background: #202127;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #444;
  overflow: auto;
}

iframe {
  display: block;
  width: 100%;
  height: 700px;
  background: white;
  border: none;
  margin: auto;
  transition: width .3s;
}

iframe.mobile {
  width: 390px;
  max-width: 100%;
  border-radius: 12px;
}

.status {
  color: #aaa;
  margin-top: 15px;
  font-size: 13px;
}

.empty {
  background: #171920;
  border: 1px solid #444;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
}

.empty p {
  color: #aaa;
  margin: 12px 0;
}

@media(max-width:600px) {
  header {
    align-items: flex-start;
    flex-direction: column;
  }

  iframe {
    height: 600px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ALFR3ON WEB BUILDER</div>

  <div class="actions">
    <a href="dashboard.html" class="btn secondary">مشاريعي</a>
    <a href="builder.html" class="btn">المحرر</a>
  </div>
</header>

<main>

  <section class="info">
    <h2 id="projectTitle">معاينة الموقع</h2>
    <p id="projectDescription">شاهد مشروعك قبل تنزيله.</p>
  </section>

  <div id="previewArea" hidden>
    <div class="toolbar">
      <div class="actions">
        <button onclick="setDevice('desktop')">الكمبيوتر</button>
        <button class="secondary" onclick="setDevice('mobile')">الموبايل</button>
      </div>

      <div class="actions">
        <button onclick="editProject()">تعديل</button>
        <button onclick="downloadProject()">تنزيل الموقع</button>
      </div>
    </div>

    <div class="screen">
      <iframe id="siteFrame" title="معاينة الموقع"></iframe>
    </div>

    <p class="status" id="status">المعاينة جاهزة.</p>
  </div>

  <div class="empty" id="emptyState" hidden>
    <h3>لم يتم العثور على المشروع</h3>
    <p>افتح المشروع من لوحة مشاريعي ثم اختر المعاينة.</p>
    <a href="dashboard.html" class="btn">العودة لمشاريعي</a>
  </div>

</main>

<script>
const STORAGE_KEY = "alfr3on_projects";

let currentProject = null;

function getProjects() {
  try {
    const data = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function loadProject() {
  const params = new URLSearchParams(location.search);
  const projectId = params.get("project");
  const projects = getProjects();

  currentProject = projects.find(
    p => String(p.id) === String(projectId)
  );

  if (!currentProject || !currentProject.code) {
    document.getElementById("emptyState").hidden = false;
    document.getElementById("previewArea").hidden = true;
    return;
  }

  document.getElementById("emptyState").hidden = true;
  document.getElementById("previewArea").hidden = false;

  document.getElementById("projectTitle").textContent =
    currentProject.name || "مشروع بدون اسم";

  document.getElementById("projectDescription").textContent =
    currentProject.description || "معاينة المشروع";

  document.getElementById("siteFrame").srcdoc =
    currentProject.code;
}

function setDevice(device) {
  const frame = document.getElementById("siteFrame");

  frame.classList.toggle("mobile", device === "mobile");

  document.getElementById("status").textContent =
    device === "mobile"
      ? "وضع معاينة الموبايل"
      : "وضع معاينة الكمبيوتر";
}

function editProject() {
  if (!currentProject) return;

  location.href =
    "builder.html?project=" +
    encodeURIComponent(currentProject.id);
}

function downloadProject() {
  if (!currentProject || !currentProject.code) return;

  const blob = new Blob(
    [currentProject.code],
    { type: "text/html;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = (currentProject.name || "my-website")
    .replace(/[\\/:*?"<>|]/g, "-") + ".html";

  link.click();

  URL.revokeObjectURL(url);

  document.getElementById("status").textContent =
    "تم تجهيز ملف الموقع للتنزيل.";
}

loadProject();
</script>

</body>
</html>
