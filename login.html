
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | ALFR3ON WEB BUILDER</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Cairo,sans-serif;
background:#090909;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.container{
width:100%;
max-width:430px;
background:#141414;
border:1px solid #303030;
border-radius:20px;
padding:30px 25px;
box-shadow:0 15px 50px #000;
}
.logo{
text-align:center;
font-size:22px;
font-weight:900;
color:#ed1830;
margin-bottom:10px;
}
.subtitle{
text-align:center;
color:#999;
font-size:13px;
margin-bottom:25px;
}
.tabs{
display:flex;
background:#090909;
padding:5px;
border-radius:10px;
margin-bottom:25px;
}
.tab{
flex:1;
padding:10px;
background:transparent;
color:#aaa;
border:0;
border-radius:8px;
font-family:inherit;
cursor:pointer;
}
.tab.active{
background:#e50920;
color:white;
}
label{
display:block;
font-size:13px;
margin:13px 0 7px;
color:#ddd;
}
input{
width:100%;
padding:13px;
border:1px solid #333;
border-radius:9px;
background:#090909;
color:white;
font-family:inherit;
outline:none;
}
input:focus{border-color:#e50920}
.submit{
width:100%;
padding:13px;
background:#e50920;
color:white;
border:0;
border-radius:9px;
font-family:inherit;
font-weight:bold;
margin-top:23px;
cursor:pointer;
}
.submit:hover{background:#bd0018}
.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:8px;
font-size:13px;
line-height:1.7;
}
.back{
display:block;
text-align:center;
color:#aaa;
text-decoration:none;
margin-top:22px;
font-size:13px;
}
.back:hover{color:#ed1830}
.hidden{display:none}
</style>
</head>
<body>

<main class="container">
<div class="logo">ALFR3ON WEB BUILDER</div>
<p class="subtitle">أنشئ مواقعك وابدأ مشروعك الرقمي</p>

<div class="tabs">
<button class="tab active" id="loginTab">تسجيل الدخول</button>
<button class="tab" id="registerTab">إنشاء حساب</button>
</div>

<form id="authForm">

<div id="nameGroup" class="hidden">
<label for="name">الاسم</label>
<input id="name" type="text" placeholder="اكتب اسمك" autocomplete="name">
</div>

<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com" required autocomplete="email">

<label for="password">كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور" required minlength="8" autocomplete="current-password">

<div id="confirmGroup" class="hidden">
<label for="confirm">تأكيد كلمة المرور</label>
<input id="confirm" type="password" placeholder="أعد كتابة كلمة المرور" minlength="8">
</div>

<button class="submit" type="submit" id="submitBtn">دخول</button>
<div class="message" id="message" role="status"></div>

</form>

<a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
</main>

<script>
const form=document.getElementById("authForm");
const loginTab=document.getElementById("loginTab");
const registerTab=document.getElementById("registerTab");
const nameGroup=document.getElementById("nameGroup");
const confirmGroup=document.getElementById("confirmGroup");
const nameInput=document.getElementById("name");
const confirmInput=document.getElementById("confirm");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("message");

let mode="login";

function showMessage(text,success=false){
message.textContent=text;
message.style.display="block";
message.style.background=success?"#12351f":"#38131a";
message.style.color=success?"#8ef0a9":"#ff8793";
}

function setMode(newMode){
mode=newMode;
const registering=mode==="register";

loginTab.classList.toggle("active",!registering);
registerTab.classList.toggle("active",registering);
nameGroup.classList.toggle("hidden",!registering);
confirmGroup.classList.toggle("hidden",!registering);

nameInput.required=registering;
confirmInput.required=registering;
submitBtn.textContent=registering?"إنشاء الحساب":"دخول";
message.style.display="none";
}

loginTab.addEventListener("click",()=>setMode("login"));
registerTab.addEventListener("click",()=>setMode("register"));

function getUsers(){
try{
return JSON.parse(localStorage.getItem("alfr3on_users")||"[]");
}catch(error){
return [];
}
}

form.addEventListener("submit",function(event){
event.preventDefault();

const email=document.getElementById("email").value.trim().toLowerCase();
const password=document.getElementById("password").value;
const users=getUsers();

if(mode==="register"){
const name=nameInput.value.trim();
const confirm=confirmInput.value;

if(name.length<2){
showMessage("اكتب اسمًا صحيحًا.");
return;
}

if(password!==confirm){
showMessage("كلمتا المرور غير متطابقتين.");
return;
}

if(users.some(user=>user.email===email)){
showMessage("هذا البريد مسجل بالفعل.");
return;
}

showMessage("التسجيل الحقيقي غير متاح في هذه النسخة التجريبية.",false);
return;
}

showMessage("نظام الحسابات لم يتم ربطه بعد بقاعدة بيانات. لا تدخل كلمة مرور حقيقية هنا.",false);
});
</script>

</body>
</html>
