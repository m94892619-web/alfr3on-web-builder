
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | ALFR3ON WEB BUILDER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.87),rgba(0,0,0,.93)),
    url("wolf-bg.jpg") center/cover fixed,
    #08090d;
  color: white;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 30px;
  background: rgba(18,20,27,.95);
  border: 1px solid #555;
  border-radius: 17px;
  box-shadow: 0 15px 50px #000;
}

.logo {
  text-align: center;
  color: #c5c8ce;
  font-size: 23px;
  font-weight: 900;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 25px;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  background: #25272e;
  color: white;
  border: 1px solid #555;
  border-radius: 9px;
  cursor: pointer;
}

.tabs button.active {
  background: #c5c8ce;
  color: #111;
  font-weight: bold;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #ddd;
}

input {
  width: 100%;
  padding: 14px;
  background: #101116;
  color: white;
  border: 1px solid #444;
  border-radius: 9px;
  outline: none;
}

input:focus {
  border-color: #c5c8ce;
}

.submit {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  background: #c5c8ce;
  color: #111;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  background: #25272e;
  color: #ddd;
  line-height: 1.7;
  font-size: 14px;
}

.home {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #bbb;
  text-decoration: none;
}

.note {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">ALFR3ON</div>
  <p class="subtitle">WEB BUILDER</p>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showForm('login')">
      تسجيل الدخول
    </button>

    <button id="registerTab" onclick="showForm('register')">
      حساب جديد
    </button>
  </div>

  <form id="loginForm">
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email"
             placeholder="example@email.com" required>
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password"
             placeholder="كلمة المرور" required>
    </div>

    <button class="submit" type="submit">
      دخول إلى حسابي
    </button>
  </form>

  <form id="registerForm" hidden>
    <div class="field">
      <label>الاسم بالكامل</label>
      <input id="registerName" type="text"
             placeholder="اكتب اسمك" required>
    </div>

    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="registerEmail" type="email"
             placeholder="example@email.com" required>
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="registerPassword" type="password"
             minlength="8" placeholder="8 أحرف على الأقل" required>
    </div>

    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password"
             minlength="8" placeholder="أعد كتابة كلمة المرور" required>
    </div>

    <button class="submit" type="submit">
      إنشاء حساب
    </button>
  </form>

  <div class="message" id="message" role="status"></div>

  <a class="home" href="index.html">العودة للصفحة الرئيسية</a>

  <p class="note">
    هذه نسخة تجريبية محلية وليست نظام حسابات حقيقيًا.
    لا تستخدم كلمة مرور حقيقية هنا.
  </p>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

function showForm(type) {
  const isLogin = type === "login";

  loginForm.hidden = !isLogin;
  registerForm.hidden = isLogin;

  document.getElementById("loginTab")
    .classList.toggle("active", isLogin);

  document.getElementById("registerTab")
    .classList.toggle("active", !isLogin);

  message.style.display = "none";
}

function getAccounts() {
  try {
    const accounts = JSON.parse(
      localStorage.getItem("alfr3on_demo_accounts") || "[]"
    );

    return Array.isArray(accounts) ? accounts : [];
  } catch {
    return [];
  }
}

registerForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("registerName").value.trim();
  const email = document.getElementById("registerEmail").value.trim().toLowerCase();
  const password = document.getElementById("registerPassword").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    showMessage("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");
    return;
  }

  if (password !== confirm) {
    showMessage("كلمتا المرور غير متطابقتين.");
    return;
  }

  const accounts = getAccounts();

  if (accounts.some(account => account.email === email)) {
    showMessage("هذا البريد مسجل بالفعل.");
    return;
  }

  accounts.push({
    id: Date.now().toString(),
    name,
    email
  });

  localStorage.setItem(
    "alfr3on_demo_accounts",
    JSON.stringify(accounts)
  );

  showMessage(
    "تم إنشاء سجل تجريبي بنجاح. لا يوجد تسجيل دخول فعلي حتى ربط Supabase."
  );

  registerForm.reset();
  showForm("login");
});

loginForm.addEventListener("submit", function(event) {
  event.preventDefault();

  showMessage(
    "تسجيل الدخول غير مفعّل حاليًا. سيتم تفعيله بعد ربط Supabase."
  );
});
</script>

</body>
</html>
