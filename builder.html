
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFR3ON WEB BUILDER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08080a;color:#eee;
 font-family:Arial,sans-serif;padding:18px
}
header{
 text-align:center;padding:22px;
 border-bottom:1px solid #333;margin-bottom:20px
}
header h1{color:#c7c7ce;margin:0 0 8px}
header p{color:#aaa}
.container{max-width:850px;margin:auto}
.panel{
 background:#131317;border:1px solid #333;
 border-radius:14px;padding:18px;margin-bottom:18px
}
label{display:block;margin:14px 0 7px}
input,textarea,select{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #555;background:#09090c;
 color:white;font-size:15px
}
textarea{min-height:130px;resize:vertical}
button{
 border:1px solid #aaa;border-radius:9px;
 padding:12px 18px;margin:8px 3px;
 cursor:pointer;font-weight:bold;
 background:linear-gradient(#eee,#999);
 color:#111;font-size:14px
}
button.dark{background:#292930;color:white;border-color:#555}
button.red{background:#8e1421;color:white;border-color:#c33}
iframe{
 width:100%;height:450px;background:white;
 border:1px solid #555;border-radius:10px
}
.project{
 padding:12px;border:1px solid #444;
 border-radius:9px;margin:10px 0;
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;flex-wrap:wrap
}
.small{color:#aaa;font-size:13px}
</style>
</head>

<body>
<header>
<h1>ALFR3ON WEB BUILDER</h1>
<p>منصة إنشاء وإدارة المواقع</p>
</header>

<div class="container">

<section class="panel">
<h2>إنشاء مشروع جديد</h2>

<label>اسم المشروع</label>
<input id="projectName" placeholder="اكتب اسم موقعك">

<label>وصف الموقع</label>
<textarea id="description" placeholder="اشرح الموقع الذي تريد إنشاءه..."></textarea>

<label>لون الموقع</label>
<select id="siteColor">
<option value="#111827">أزرق داكن</option>
<option value="#111111">أسود</option>
<option value="#8b0000">أحمر</option>
<option value="#17452d">أخضر</option>
<option value="#563080">بنفسجي</option>
</select>

<button onclick="generateSite()">إنشاء معاينة</button>
<button class="dark" onclick="saveProject()">حفظ المشروع</button>
<button class="dark" onclick="newProject()">مشروع جديد</button>
</section>

<section class="panel">
<h2>معاينة الموقع</h2>
<iframe id="preview"></iframe>
<button onclick="downloadSite()">تنزيل ملف الموقع</button>
</section>

<section class="panel">
<h2>مشاريعي المحفوظة</h2>
<div id="projectsList"></div>
</section>

</div>

<script>
const STORAGE_KEY = "alfr3on_projects";
let currentId = null;
let currentHTML = "";

function getProjects(){
 try{
  return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
 }catch(e){return []}
}

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function generateSite(){
 const name=document.getElementById("projectName").value.trim();
 const desc=document.getElementById("description").value.trim();
 const color=document.getElementById("siteColor").value;

 if(!name || !desc){
  alert("اكتب اسم المشروع ووصف الموقع أولاً");
  return;
 }

 currentHTML=`<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHTML(name)}</title>
<style>
body{margin:0;font-family:Arial;background:${color};color:white;text-align:center}
header{padding:65px 15px}
h1{font-size:38px}
p{font-size:19px;line-height:1.9}
main{max-width:750px;margin:auto;padding:20px}
footer{padding:25px;background:#0005}
</style>
</head>
<body>
<header>
<h1>${escapeHTML(name)}</h1>
<p>${escapeHTML(desc).replace(/\n/g,"<br>")}</p>
</header>
<main>
<h2>مرحباً بك</h2>
<p>هذا موقعك المبدئي. يمكنك تطويره وإضافة الأقسام والصور والروابط لاحقاً.</p>
</main>
<footer>تم الإنشاء بواسطة ALFR3ON WEB BUILDER</footer>
</body>
</html>`;

 document.getElementById("preview").srcdoc=currentHTML;
}

function escapeHTML(value){
 return value.replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function saveProject(){
 const name=document.getElementById("projectName").value.trim();
 const desc=document.getElementById("description").value.trim();

 if(!name || !desc){
  alert("اكتب اسم المشروع والوصف");
  return;
 }

 if(!currentHTML) generateSite();
 if(!currentHTML) return;

 let projects=getProjects();
 const now=new Date().toISOString();

 if(currentId){
  const index=projects.findIndex(p=>p.id===currentId);
  if(index!==-1){
   projects[index]={...projects[index],name,prompt:desc,html:currentHTML,timestamp:now};
  }else{
   projects.push({id:currentId,name,prompt:desc,html:currentHTML,timestamp:now});
  }
 }else{
  currentId=makeId();
  projects.push({id:currentId,name,prompt:desc,html:currentHTML,timestamp:now});
 }

 localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
 renderProjects();
 alert("تم حفظ المشروع على هذا الجهاز");
}

function renderProjects(){
 const list=document.getElementById("projectsList");
 const projects=getProjects();

 if(!projects.length){
  list.innerHTML="<p class='small'>لا توجد مشاريع محفوظة حتى الآن</p>";
  return;
 }

 list.innerHTML="";
 projects.forEach(p=>{
  const div=document.createElement("div");
  div.className="project";

  const info=document.createElement("div");
  const title=document.createElement("strong");
  title.textContent=p.name;
  const date=document.createElement("div");
  date.className="small";
  date.textContent=p.timestamp ? new Date(p.timestamp).toLocaleString("ar-EG") : "";
  info.append(title,date);

  const actions=document.createElement("div");
  const open=document.createElement("button");
  open.className="dark";
  open.textContent="فتح";
  open.onclick=()=>openProject(p.id);

  const del=document.createElement("button");
  del.className="red";
  del.textContent="حذف";
  del.onclick=()=>deleteProject(p.id);

  actions.append(open,del);
  div.append(info,actions);
  list.append(div);
 });
}

function openProject(id){
 const p=getProjects().find(x=>x.id===id);
 if(!p)return;

 currentId=p.id;
 currentHTML=p.html || "";
 document.getElementById("projectName").value=p.name || "";
 document.getElementById("description").value=p.prompt || "";
 document.getElementById("preview").srcdoc=currentHTML;
 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProject(id){
 if(!confirm("هل تريد حذف المشروع؟"))return;

 const projects=getProjects().filter(p=>p.id!==id);
 localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));

 if(currentId===id)newProject();
 renderProjects();
}

function newProject(){
 currentId=null;
 currentHTML="";
 document.getElementById("projectName").value="";
 document.getElementById("description").value="";
 document.getElementById("preview").srcdoc="";
}

function downloadSite(){
 if(!currentHTML){
  alert("أنشئ معاينة الموقع أولاً");
  return;
 }
 const blob=new Blob([currentHTML],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="alfr3on-website.html";
 a.click();
 URL.revokeObjectURL(url);
}

function loadFromAddress(){
 const params=new URLSearchParams(location.search);
 const projectId=params.get("project");
 const template=params.get("template");
 const prompt=params.get("prompt");

 if(projectId){
  openProject(projectId);
 }else if(template){
  document.getElementById("projectName").value=template;
 }else if(prompt){
  document.getElementById("description").value=prompt;
 }
}

renderProjects();
loadFromAddress();
</script>
</body>
</html>
