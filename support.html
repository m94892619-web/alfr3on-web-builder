
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFR3ON - الدعم الفني</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#080808;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:650px;
margin:50px auto;
background:#151515;
border:1px solid #444;
border-radius:18px;
padding:25px;
}

h1,h2{color:#c0c0c0;text-align:center}

p{
color:#aaa;
text-align:center;
line-height:1.8;
}

label{
display:block;
margin:18px 0 8px;
}

input,textarea{
width:100%;
padding:13px;
background:#080808;
color:white;
border:1px solid #555;
border-radius:8px;
font-size:15px;
}

textarea{
min-height:130px;
resize:vertical;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:1px solid white;
border-radius:9px;
background:linear-gradient(135deg,#fff,#bbb,#777);
color:#080808;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
filter:brightness(1.15);
}

.footer{
margin-top:25px;
color:#666;
text-align:center;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>ALFR3ON</h1>
<h2>مركز الدعم الفني</h2>

<p>
واجهتك مشكلة أو عندك استفسار؟
اكتب رسالتك وسنتواصل معك عبر واتساب.
</p>

<label>اسمك</label>
<input id="name" placeholder="اكتب اسمك">

<label>موضوع الرسالة</label>
<input id="subject" placeholder="مثلاً: مشكلة في إنشاء موقع">

<label>تفاصيل الرسالة</label>
<textarea id="message" placeholder="اشرح لنا المشكلة..."></textarea>

<button onclick="sendMessage()">
إرسال عبر واتساب
</button>

<div class="footer">
ALFR3ON DEZAINER © 2026
</div>

</div>

<script>
function sendMessage(){

const name=document.getElementById("name").value.trim();
const subject=document.getElementById("subject").value.trim();
const message=document.getElementById("message").value.trim();

if(!name || !subject || !message){
alert("من فضلك املأ جميع البيانات");
return;
}

const text=
"رسالة دعم فني - ALFR3ON WEB BUILDER\n"+
"الاسم: "+name+"\n"+
"الموضوع: "+subject+"\n"+
"التفاصيل: "+message;

const url="https://wa.me/201035710432?text="+
encodeURIComponent(text);

window.open(url,"_blank");
}
</script>

</body>
</html>
