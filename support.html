
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم الفني | ALFR3ON WEB BUILDER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;
  background:
    linear-gradient(rgba(0,0,0,.87),rgba(0,0,0,.93)),
    url("wolf-bg.jpg") center/cover fixed,
    #08090d;
}

header {
  background: rgba(0,0,0,.8);
  border-bottom: 1px solid #444;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  font-size: 21px;
  font-weight: 900;
  color: #c5c8ce;
}

header a {
  color: white;
  text-decoration: none;
  border: 1px solid #777;
  padding: 9px 15px;
  border-radius: 8px;
}

.container {
  width: min(750px, 92%);
  margin: 35px auto;
}

.subtitle {
  color: #aaa;
  margin: 10px 0 25px;
  line-height: 1.8;
}

.panel {
  background: rgba(18,20,27,.95);
  border: 1px solid #444;
  border-radius: 15px;
  padding: 24px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 9px;
  color: #ddd;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  background: #101116;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  outline: none;
  font-family: inherit;
}

input:focus, select:focus, textarea:focus {
  border-color: #c5c8ce;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  background: #c5c8ce;
  color: #111;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.12);
}

.note {
  color: #999;
  font-size: 13px;
  margin-top: 16px;
  line-height: 1.8;
}

footer {
  text-align: center;
  color: #888;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ALFR3ON WEB BUILDER</div>
  <a href="index.html">الرئيسية</a>
</header>

<main class="container">

  <h1>الدعم الفني</h1>

  <p class="subtitle">
    واجهتك مشكلة أو عندك استفسار؟
    اكتب تفاصيل طلبك وسيتم فتح محادثة واتساب لإرساله.
  </p>

  <section class="panel">

    <form id="supportForm">

      <div class="field">
        <label for="name">الاسم</label>
        <input id="name" type="text"
               placeholder="اكتب اسمك" required>
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email"
               placeholder="example@email.com" required>
      </div>

      <div class="field">
        <label for="type">نوع الطلب</label>
        <select id="type" required>
          <option value="">اختر نوع الطلب</option>
          <option>مشكلة تقنية</option>
          <option>مشكلة في الحساب</option>
          <option>مشكلة في إنشاء موقع</option>
          <option>استفسار عن المنصة</option>
          <option>اقتراح تطوير</option>
          <option>طلب آخر</option>
        </select>
      </div>

      <div class="field">
        <label for="details">تفاصيل المشكلة</label>
        <textarea id="details"
          placeholder="اشرح لنا المشكلة بالتفصيل..."
          required></textarea>
      </div>

      <button type="submit">إرسال طلب الدعم عبر واتساب</button>

      <p class="note">
        سيتم فتح واتساب برسالة جاهزة.
        يجب عليك الضغط على إرسال داخل واتساب لإتمام الإرسال.
      </p>

    </form>

  </section>

</main>

<footer>
  ALFR3ON DEZAINER © 2026
</footer>

<script>
const SUPPORT_NUMBER = "201035710432";

document.getElementById("supportForm")
.addEventListener("submit", function(event) {

  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const type = document.getElementById("type").value;
  const details = document.getElementById("details").value.trim();

  if (!name || !email || !type || !details) {
    alert("من فضلك أكمل جميع البيانات.");
    return;
  }

  const message =
`طلب دعم فني - ALFR3ON WEB BUILDER

الاسم: ${name}
البريد الإلكتروني: ${email}
نوع الطلب: ${type}

تفاصيل الطلب:
${details}`;

  const url =
    "https://wa.me/" + SUPPORT_NUMBER +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
});
</script>

</body>
</html>
